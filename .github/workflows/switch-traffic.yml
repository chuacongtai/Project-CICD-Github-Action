name: Switch ALB Traffic

on:
  workflow_dispatch: {}
  workflow_call: {}

env:
  AWS_REGION: ap-southeast-1
  ALB_ARN: arn:aws:elasticloadbalancing:ap-southeast-1:572498579257:loadbalancer/app/alb-cicd-github-actions/31bbca10a0e9ab04
  
  # Defauft port
  PROD_PORT: 80
  TEST_PORT: 81

jobs:
  switch-traffic:
    runs-on: ubuntu-latest
    
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        mask-aws-account-id: false
        
    - name: Switch traffic between Blue and Green (by Port)
      run: |
        set -euo pipefail

        echo "Get infomation of ALB..."
        LISTENERS=$(aws elbv2 describe-listeners --load-balancer-arn ${{ env.ALB_ARN }})

        # Find Listener of Port
        PROD_LISTENER_ARN=$(echo "$LISTENERS" | jq -r --arg port "${{ env.PROD_PORT }}" '
          .Listeners[] | select(.Port == ($port | tonumber)) | .ListenerArn // empty')
        
        TEST_LISTENER_ARN=$(echo "$LISTENERS" | jq -r --arg port "${{ env.TEST_PORT }}" '
          .Listeners[] | select(.Port == ($port | tonumber)) | .ListenerArn // empty')

        # Get Target Group current for each listener
        PROD_TG=$(echo "$LISTENERS" | jq -r --arg port "${{ env.PROD_PORT }}" '
          .Listeners[] | select(.Port == ($port | tonumber)) | .DefaultActions[0].TargetGroupArn // empty')
        
        TEST_TG=$(echo "$LISTENERS" | jq -r --arg port "${{ env.TEST_PORT }}" '
          .Listeners[] | select(.Port == ($port | tonumber)) | .DefaultActions[0].TargetGroupArn // empty')

        # Kiểm tra bắt buộc
        if [ -z "$PROD_LISTENER_ARN" ] || [ -z "$TEST_LISTENER_ARN" ]; then
          echo "Don't have Listener port ${{ env.PROD_PORT }} or port ${{ env.TEST_PORT }}"
          echo "Current listeners:"
          echo "$LISTENERS" | jq -r '.Listeners[] | "Port: \(.Port) | ARN: \(.ListenerArn)"'
          exit 1
        fi

        if [ -z "$PROD_TG" ] || [ -z "$TEST_TG" ]; then
          echo "Don't get Target Group current"
          exit 1
        fi

        echo "Current state:"
        echo "  Production (port ${{ env.PROD_PORT }}): $PROD_TG"
        echo "  Test       (port ${{ env.TEST_PORT }}): $TEST_TG"
        echo ""

        # === SWITCH ===
        echo "Switching traffic..."
        echo "  → Port ${{ env.PROD_PORT }} will point to: $TEST_TG"
        echo "  → Port ${{ env.TEST_PORT }} ưill point to: $PROD_TG"

        # Update Production listener (port 80) → point to Target Group in Test production
        aws elbv2 modify-listener \
          --listener-arn "$PROD_LISTENER_ARN" \
          --default-actions Type=forward,TargetGroupArn="$TEST_TG"

        # Update Test listener (port 81) → point to old Target Group of Production
        aws elbv2 modify-listener \
          --listener-arn "$TEST_LISTENER_ARN" \
          --default-actions Type=forward,TargetGroupArn="$PROD_TG"

        echo ""
        echo "Successfully switch traffic!"

        # Verify 
        echo "Cheking after switch traffic..."
        UPDATED=$(aws elbv2 describe-listeners --load-balancer-arn ${{ env.ALB_ARN }})

        NEW_PROD_TG=$(echo "$UPDATED" | jq -r --arg port "${{ env.PROD_PORT }}" '
          .Listeners[] | select(.Port == ($port | tonumber)) | .DefaultActions[0].TargetGroupArn')
        
        NEW_TEST_TG=$(echo "$UPDATED" | jq -r --arg port "${{ env.TEST_PORT }}" '
          .Listeners[] | select(.Port == ($port | tonumber)) | .DefaultActions[0].TargetGroupArn')

        echo "New state:"
        echo "  Production (port ${{ env.PROD_PORT }}): $NEW_PROD_TG"
        echo "  Test       (port ${{ env.TEST_PORT }}): $NEW_TEST_TG"

        # Safety check
        if [ "$NEW_PROD_TG" != "$TEST_TG" ] || [ "$NEW_TEST_TG" != "$PROD_TG" ]; then
          echo "Verify failed! Target Group after switch false."
          exit 1
        fi

        echo "Successfully verify. Traffic have been tranfer."